<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142e27">
  <title>Library Treasure Hunt</title>
  <link rel="icon" href="assets/markers/octopus-hideout.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/aframe-1.6.0.min.js"></script>
  <script defer src="vendor/arjs-3.4.8.js"></script>
  <script type="module" src="hunt.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Library Treasure Hunt</h1>
    <a href="markers.html">Marker sheet</a>
  </header>
  <main class="hunt">
    <section class="scanner" aria-labelledby="scan-title">
      <div id="camera" class="camera">
        <div id="camera-intro" class="camera-intro">
          <h2 id="scan-title">Find the escaped characters</h2>
          <p>Scan a hiding-place marker, catch the character, then find its book.</p>
          <button id="start" type="button">Start camera</button>
        </div>
      </div>
      <div class="scan-controls">
        <p id="status" role="status">Allow camera access to start the hunt.</p>
        <button type="button" id="catch" hidden>Catch</button>
      </div>
    </section>
    <section class="collection" aria-labelledby="collection-title">
      <div class="collection-heading">
        <h2 id="collection-title">Your collection <span id="count"></span></h2>
        <button class="text-button" type="button" id="reset">Reset progress</button>
      </div>
      <ul id="characters"></ul>
      <p id="storage-warning" hidden>Progress can only be saved for this visit. Your browser blocked local storage.</p>
    </section>
  </main>
</body>
</html>
